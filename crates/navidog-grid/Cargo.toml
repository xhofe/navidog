[package]
name = "navidog-grid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Result grid and table viewer for navidog."

[dependencies]
navidog-session = { path = "../navidog-session" }
navidog-ui.workspace = true
navidog-model.workspace = true
navidog-app-state.workspace = true
navidog-util.workspace = true
navidog-sql = { path = "../navidog-sql" }
navidog-db.workspace = true
chrono.workspace = true
gpui-kit = { workspace = true, features = ["tree-sitter-sql"] }
rust-i18n.workspace = true
tracing.workspace = true
tokio.workspace = true
serde_json.workspace = true

[dev-dependencies]
navidog-test-support = { path = "../navidog-test-support" }
gpui-kit = { workspace = true, features = ["test-support"] }
