[package]
name = "navidog-navigator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Object browser for navidog."

[dependencies]
navidog-session = { path = "../navidog-session" }
navidog-ui.workspace = true
navidog-model.workspace = true
navidog-sql = { path = "../navidog-sql" }
navidog-app-state.workspace = true
navidog-db.workspace = true
navidog-util.workspace = true
gpui-kit = { workspace = true, features = ["tree-sitter-sql"] }
rust-i18n.workspace = true
tracing.workspace = true
tokio.workspace = true
serde_json.workspace = true
serde.workspace = true
chrono.workspace = true

[dev-dependencies]
navidog-mysql = { path = "../navidog-mysql" }
navidog-postgres = { path = "../navidog-postgres" }
navidog-sqlite = { path = "../navidog-sqlite" }
navidog-test-support = { path = "../navidog-test-support" }
gpui-kit = { workspace = true, features = ["test-support", "tree-sitter-sql"] }
tempfile = "3"
