[package]
name = "navidog-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Driver traits, runtime and SSH tunnels for navidog. Product drivers live in their own crates."

[dependencies]
navidog-model.workspace = true
navidog-sql-log = { path = "../navidog-sql-log" }
navidog-util.workspace = true
navidog-sql = { path = "../navidog-sql" }
rust-i18n.workspace = true
chrono.workspace = true
thiserror.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
russh = { version = "0.64", default-features = false, features = ["flate2", "ring", "rsa"] }

[dev-dependencies]
navidog-session = { path = "../navidog-session" }
navidog-mysql = { path = "../navidog-mysql" }
navidog-postgres = { path = "../navidog-postgres" }
navidog-sqlite = { path = "../navidog-sqlite" }
tempfile = "3"
