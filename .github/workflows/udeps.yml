name: Unused dependencies

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  # One macOS workspace scan at a time per ref. Queue instead of cancelling:
  # a weekly run and a manual run must not throw each other away halfway.
  group: udeps-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  udeps:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-udeps
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-udeps
      - name: cargo udeps
        run: cargo +nightly udeps --workspace
