name: Security Audit

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  # Same event and ref cancel their own outdated run. The weekly schedule
  # files an advisory issue and shares main's ref with pushes, so it stays
  # in its own group and a commit cannot cut it off.
  group: audit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # `rustsec/audit-check` publishes its result as a check run on push/PR and as an
  # issue on the weekly schedule; without `checks: write` the check run never gets
  # created and the step dies with "Resource not accessible by integration".
  checks: write
  issues: write

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
